# Builds the static site and deploys it to Cloudflare Pages on push to main.
# All values are static; no untrusted GitHub-event data is interpolated into
# run steps, so there is no event-injection risk. Secrets are passed via env.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node build.mjs

      # Refuses the deploy on an over-long title, a duplicate description, an
      # unparseable JSON-LD graph, FAQ markup that has drifted from the page,
      # a sitemap that disagrees with what was built, a missing 404.html, or an
      # em-dash. All static values, no GitHub-event data interpolated.
      - name: SEO check
        run: node seo-check.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deployment."
            exit 1
          fi
          npx wrangler@4 pages deploy dist --project-name tourdefrancelancashire --branch main --commit-dirty=true
