<!DOCTYPE html>
<html lang="en-GB">
<head>
  <script>document.documentElement.className += ' has-js';</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{page.fullTitle}}</title>
  <meta name="description" content="{{page.description}}" />
  <link rel="canonical" href="{{page.canonical}}" />
  <meta name="theme-color" content="{{site.themeColor}}" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="author" content="{{site.name}}" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{site.name}}" />
  <meta property="og:title" content="{{page.fullTitle}}" />
  <meta property="og:description" content="{{page.description}}" />
  <meta property="og:url" content="{{page.canonical}}" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:image" content="{{site.url}}/img/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Tour de France Lancashire: Stage 2, 3 July 2027" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{page.fullTitle}}" />
  <meta name="twitter:description" content="{{page.description}}" />
  <meta name="twitter:image" content="{{site.url}}/img/og-default.png" />

  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="alternate" type="application/rss+xml" title="{{site.name}} News" href="/feed.xml" />

  <link rel="preload" href="/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/site.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "Tour de France 2027: Stage 2 in Lancashire",
    "startDate": "2027-07-03",
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "eventStatus": "https://schema.org/EventScheduled",
    "description": "Stage 2 of the 2027 Tour de France races roughly 80 miles through Lancashire on Saturday 3 July 2027, from Keswick to Liverpool.",
    "location": { "@type": "Place", "name": "Lancashire, England", "address": { "@type": "PostalAddress", "addressRegion": "Lancashire", "addressCountry": "GB" } },
    "isAccessibleForFree": true
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "{{site.url}}/#website",
        "url": "{{site.url}}/",
        "name": "{{site.name}}",
        "description": "{{site.tagline}}",
        "inLanguage": "en-GB",
        "publisher": { "@id": "{{site.url}}/#org" }
      },
      {
        "@type": "Organization",
        "@id": "{{site.url}}/#org",
        "name": "{{site.name}}",
        "url": "{{site.url}}/",
        "logo": "{{site.url}}/img/og-default.png",
        "description": "An independent, unofficial visitor guide to the 2027 Tour de France Grand Départ in Lancashire. Not affiliated with A.S.O. or Grand Départ GB."
      }
    ]
  }
  </script>
</head>
<body class="{{page.bodyClass}}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{> header}}
  <main id="main">
    {{content}}
  </main>
  {{> footer}}
  <script src="/js/reveal.js" defer></script>
  <script src="/js/i18n.js" defer></script>
</body>
</html>
