<!DOCTYPE html>
<html lang="en-GB">
<head>
  <script>document.documentElement.className += ' has-js';</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{page.fullTitle}}</title>
  <meta name="description" content="{{page.description}}" />
  <link rel="canonical" href="{{page.canonical}}" />
  <meta name="theme-color" content="{{site.themeColor}}" />
  <meta name="robots" content="{{page.robots}}" />
  <meta name="author" content="{{site.name}}" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{site.name}}" />
  <meta property="og:title" content="{{page.fullTitle}}" />
  <meta property="og:description" content="{{page.description}}" />
  <meta property="og:url" content="{{page.canonical}}" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:image" content="{{site.url}}{{page.ogimage}}" />
  <meta property="og:image:width" content="{{page.ogwidth}}" />
  <meta property="og:image:height" content="{{page.ogheight}}" />
  <meta property="og:image:alt" content="{{page.ogalt}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{page.fullTitle}}" />
  <meta name="twitter:description" content="{{page.description}}" />
  <meta name="twitter:image" content="{{site.url}}{{page.ogimage}}" />

  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="alternate" type="application/rss+xml" title="{{site.name}} News" href="/feed.xml" />

  <link rel="preload" href="/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/site.css" />

  {{page.jsonld}}
</head>
<body class="{{page.bodyClass}}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{> header}}
  <main id="main">
    {{content}}
  </main>
  {{> footer}}
  <script src="/js/reveal.js" defer></script>
  <script src="/js/i18n.js" defer></script>
</body>
</html>
