<svg class="route-map" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="routeMapTitle routeMapDesc">
  <title id="routeMapTitle">Map of Tour de France 2027 Stage 2 through Lancashire</title>
  <desc id="routeMapDesc">A stylised map of the Stage 2 route from Keswick, down the Morecambe Bay coast through Lancaster, over the Côte de Jubilee Tower, across the Forest of Bowland to Clitheroe, Whalley, Blackburn and Chorley, and on through West Lancashire to finish in Liverpool.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EEDF"/>
      <stop offset="1" stop-color="#FBF6EC"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="1" stop-color="#9E0B25"/>
    </linearGradient>
  </defs>

  <!-- land -->
  <rect x="0" y="0" width="900" height="620" fill="url(#sky)"/>

  <!-- sea to the west + Morecambe Bay -->
  <path d="M0,0 L118,0 C108,70 132,110 120,150 C168,182 70,206 96,248 C126,290 104,322 132,360 C112,448 140,532 122,620 L0,620 Z"
        fill="#CDE3E6"/>
  <path d="M118,0 C108,70 132,110 120,150 C168,182 70,206 96,248 C126,290 104,322 132,360 C112,448 140,532 122,620"
        fill="none" stroke="#9FC4C9" stroke-width="2"/>
  <text x="46" y="330" class="map-sea" transform="rotate(-90 46 330)">Irish Sea</text>

  <!-- Forest of Bowland contour texture -->
  <g fill="none" stroke="#7FA98C" opacity="0.35">
    <path d="M400 150 C470 120 560 130 590 175 C610 210 560 250 490 250 C420 250 370 210 400 150 Z" stroke-width="1.5"/>
    <path d="M420 165 C475 142 545 150 568 185 C583 212 545 240 492 240 C438 240 400 210 420 165 Z" stroke-width="1.2"/>
    <path d="M442 180 C482 164 528 170 546 195 C558 214 528 230 492 230 C456 230 428 210 442 180 Z" stroke-width="1"/>
    <path d="M462 194 C490 184 518 188 530 204 C538 216 518 224 492 224 C468 224 452 212 462 194 Z" stroke-width="0.9"/>
  </g>
  <text x="470" y="150" class="map-region">FOREST OF BOWLAND</text>

  <!-- watermark rose -->
  <g transform="translate(760 500) scale(0.55) translate(-100 -100)" opacity="0.10">
    <g fill="#C8102E">
      <path d="M100 100 C74 72 74 44 100 26 C126 44 126 72 100 100 Z" transform="rotate(0 100 100)"/>
      <path d="M100 100 C74 72 74 44 100 26 C126 44 126 72 100 100 Z" transform="rotate(72 100 100)"/>
      <path d="M100 100 C74 72 74 44 100 26 C126 44 126 72 100 100 Z" transform="rotate(144 100 100)"/>
      <path d="M100 100 C74 72 74 44 100 26 C126 44 126 72 100 100 Z" transform="rotate(216 100 100)"/>
      <path d="M100 100 C74 72 74 44 100 26 C126 44 126 72 100 100 Z" transform="rotate(288 100 100)"/>
    </g>
  </g>

  <!-- Cumbria approach (lighter, dashed) -->
  <path d="M150 60 C158 100 150 150 170 190" fill="none" stroke="#B6805A" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.7"/>

  <!-- Lancashire route: casing + ribbon -->
  <path id="routeLine" d="M170 190
      C178 215 150 235 140 250
      C150 270 185 278 215 285
      C255 292 300 270 330 250
      C375 232 415 222 460 220
      C520 220 560 250 600 275
      C625 300 635 318 630 340
      C628 368 615 388 600 410
      C560 435 515 452 470 470
      C425 483 375 497 320 505
      C270 515 215 540 170 560"
      pathLength="100" fill="none" stroke="#7A0A1D" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
  <use href="#routeLine" class="route-draw" stroke="url(#route)" stroke-width="6" opacity="1"/>

  <!-- start flag: Keswick -->
  <g transform="translate(150 60)">
    <circle r="7" fill="#1B4332"/>
    <circle r="3" fill="#FBF6EC"/>
    <text x="14" y="-4" class="map-label map-label--muted">START</text>
    <text x="14" y="11" class="map-place map-place--muted">Keswick, Cumbria</text>
  </g>

  <!-- climb marker: Côte de Jubilee Tower -->
  <g transform="translate(330 250)">
    <path d="M0 -13 L11 8 L-11 8 Z" fill="#E8B04B" stroke="#B9822A" stroke-width="1.5"/>
    <text x="0" y="30" class="map-place map-climb" text-anchor="middle">Côte de Jubilee Tower</text>
    <text x="0" y="44" class="map-sub" text-anchor="middle">Category climb</text>
  </g>

  <!-- town nodes -->
  <g class="nodes">
    <g transform="translate(170 190)"><circle r="6" class="dot"/><text x="12" y="4" class="map-place">Morecambe Bay</text></g>
    <g transform="translate(140 250)"><circle r="6" class="dot"/><text x="-12" y="4" class="map-place" text-anchor="end">Morecambe</text></g>
    <g transform="translate(215 285)"><circle r="6" class="dot"/><text x="-12" y="4" class="map-place" text-anchor="end">Lancaster</text></g>
    <g transform="translate(460 220)"><circle r="6" class="dot"/><text x="0" y="-14" class="map-place" text-anchor="middle">Bowland fells</text></g>
    <g transform="translate(600 275)"><circle r="6" class="dot"/><text x="14" y="4" class="map-place">Clitheroe</text></g>
    <g transform="translate(630 340)"><circle r="6" class="dot"/><text x="14" y="4" class="map-place">Whalley &amp; Langho</text></g>
    <g transform="translate(600 410)"><circle r="6" class="dot"/><text x="14" y="4" class="map-place">Blackburn</text></g>
    <g transform="translate(470 470)"><circle r="6" class="dot"/><text x="0" y="24" class="map-place" text-anchor="middle">Chorley</text></g>
    <g transform="translate(320 505)"><circle r="6" class="dot"/><text x="0" y="24" class="map-place" text-anchor="middle">West Lancashire</text></g>
  </g>

  <!-- finish -->
  <g transform="translate(170 560)">
    <g transform="translate(-9 -30)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#17171F" stroke-width="2"/>
      <rect x="0" y="0" width="18" height="12" fill="#17171F"/>
      <rect x="0" y="0" width="6" height="6" fill="#FBF6EC"/>
      <rect x="12" y="0" width="6" height="6" fill="#FBF6EC"/>
      <rect x="6" y="6" width="6" height="6" fill="#FBF6EC"/>
    </g>
    <circle r="7" fill="#C8102E"/>
    <circle r="3" fill="#FBF6EC"/>
    <text x="14" y="0" class="map-label">FINISH</text>
    <text x="14" y="15" class="map-place">The Strand, Liverpool</text>
  </g>

  <!-- compass -->
  <g transform="translate(845 70)" opacity="0.75">
    <circle r="20" fill="none" stroke="#1B4332" stroke-width="1.5"/>
    <path d="M0 -16 L5 2 L0 -2 L-5 2 Z" fill="#C8102E"/>
    <path d="M0 16 L5 -2 L0 2 L-5 -2 Z" fill="#1B4332"/>
    <text x="0" y="-24" class="map-sub" text-anchor="middle">N</text>
  </g>
</svg>
