<svg class="lm" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of Morecambe Bay at sunset with the Lakeland hills beyond">
  <defs>
    <linearGradient id="mo-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D9A6"/><stop offset="1" stop-color="#FBEFD6"/></linearGradient>
    <linearGradient id="mo-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFD8DA"/><stop offset="1" stop-color="#9CC0C4"/></linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#mo-sky)"/>
  <circle cx="160" cy="92" r="30" fill="#E8944B" opacity="0.9"/>
  <!-- Lakeland hills across the bay -->
  <path d="M0 118 L44 96 L92 116 L150 88 L210 114 L268 94 L320 116 L320 132 L0 132 Z" fill="#8FA0AE" opacity="0.85"/>
  <!-- sea -->
  <rect x="0" y="130" width="320" height="60" fill="url(#mo-sea)"/>
  <g stroke="#E8B77A" stroke-width="2" opacity="0.8"><line x1="120" y1="150" x2="200" y2="150"/><line x1="132" y1="160" x2="188" y2="160"/></g>
  <!-- promenade -->
  <rect x="0" y="188" width="320" height="32" fill="#D8CBB0"/>
  <rect x="0" y="186" width="320" height="4" fill="#B7A988"/>
  <!-- railings -->
  <g stroke="#8C8069" stroke-width="1.4"><line x1="0" y1="188" x2="320" y2="188"/><line x1="40" y1="180" x2="40" y2="188"/><line x1="90" y1="180" x2="90" y2="188"/><line x1="140" y1="180" x2="140" y2="188"/><line x1="190" y1="180" x2="190" y2="188"/><line x1="240" y1="180" x2="240" y2="188"/><line x1="290" y1="180" x2="290" y2="188"/><line x1="20" y1="181" x2="310" y2="181"/></g>
</svg>
