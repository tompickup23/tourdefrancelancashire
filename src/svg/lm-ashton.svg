    <!-- entablature -->
    <rect x="-44" y="62" width="88" height="10"/>
    <!-- drum -->
    <rect x="-30" y="40" width="60" height="24" rx="4"/>
    <!-- dome -->
    <path d="M-32 40 C-32 8 32 8 32 40 Z" fill="#5E8C7B" stroke="#3F6857"/>
