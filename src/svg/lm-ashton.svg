<svg class="lm" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the Ashton Memorial, Williamson Park, Lancaster">
  <defs><linearGradient id="as-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDE7F2"/><stop offset="1" stop-color="#FBF6EC"/></linearGradient></defs>
  <rect width="320" height="220" fill="url(#as-sky)"/>
  <circle cx="66" cy="60" r="22" fill="#E8B04B" opacity="0.7"/>
  <path d="M0 168 C90 150 230 150 320 168 L320 220 L0 220 Z" fill="#4E8261"/>
  <path d="M0 190 C110 176 220 176 320 190 L320 220 L0 220 Z" fill="#2E6B47"/>
